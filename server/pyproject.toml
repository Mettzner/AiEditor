[project]
name = "aieditor-server"
version = "0.1.0"
description = "AiEditor: roteiro + narração → vídeo montado e renderizado"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.8",
    "keyring>=25",
    "anthropic>=0.70",
    "faster-whisper>=1.1",
    "pillow>=10.4",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.directions" = ["*/*.json", "*/*.md", "*/*.png", "*/*.svg"]
